# Configure ServerAdmin and ServerName
ServerName localhost
ServerAdmin webmaster@localhost

# Configure main document root
DocumentRoot ${APACHE_DOCUMENT_ROOT}

# Set basic settings for document root. Configure correct directory indexes and disable directory browsing
<Directory ${APACHE_DOCUMENT_ROOT}>
    AllowOverride All
    Require all granted
    Options -Indexes +FollowSymLinks
    DirectoryIndex index.php index.html index.htm
</Directory>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

# Configure Log Settings
ErrorLog /dev/stderr
LogLevel warn

# Combined format + response time (µs), without AWS load balancer health checks.
# Private source only: a client spoofing this user agent from the internet is still logged.
SetEnvIfExpr "%{HTTP_USER_AGENT} =~ m#^ELB-HealthChecker/# && (-R '10.0.0.0/8' || -R '172.16.0.0/12' || -R '192.168.0.0/16')" dontlog
CustomLog /dev/stdout "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D" env=!dontlog
